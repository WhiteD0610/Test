<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>服サーチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#1F3A5F; --indigo2:#2C5282; --stitch:#E2A03F;
  --bg:#EEF1F4; --paper:#FFFFFF; --ink:#1A1D21; --sub:#5E6772; --line:#D5DBE2;
  --danger:#C0392B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161C; --paper:#1C222B; --ink:#E9EDF2; --sub:#9AA4B0; --line:#2E3742; --indigo2:#5B8BD0;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
header{background:var(--indigo);color:#fff;padding:14px 18px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
header h1{margin:0 0 12px;font-size:20px;font-weight:900;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
header h1 svg{flex:none}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;background:none;border:0;color:#B9C8DC;font:inherit;font-weight:700;padding:10px 0 12px;border-bottom:3px dashed transparent;font-size:15px}
.tabs button.on{color:#fff;border-bottom-color:var(--stitch)}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;font:inherit;font-weight:700;color:var(--sub);padding:10px 4px;border-radius:9px;font-size:14px}
.seg button.on{background:var(--indigo);color:#fff}
.panel{display:none}.panel.on{display:block}
#camWrap{position:relative;width:100%;max-height:62vh;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4;display:none;margin:0 auto}
#cam{width:100%;height:100%;object-fit:contain;display:block}
#camWrap .frame{position:absolute;inset:12% 8%;border:2px dashed rgba(255,255,255,.7);border-radius:10px;pointer-events:none}
.shutter{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25)}
.shutter:active{background:rgba(255,255,255,.6)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
#cam{transform-origin:center center}
.shutter:disabled{opacity:.5}
.camctrl{flex-direction:column;gap:8px;margin-top:10px}
.zm{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--sub)}
.zm input{flex:1;accent-color:var(--indigo2)}
.zm b{min-width:38px;text-align:right;color:var(--ink)}
.ln select{width:100%;font:inherit;font-size:14px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.trayh{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--sub);margin:14px 2px 6px}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#000}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:26px;padding:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:16px;background:var(--indigo);color:#fff}
.btn.ghost{background:var(--paper);color:var(--indigo2);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;margin-top:10px}
.hint{color:var(--sub);font-size:13px;line-height:1.6;margin:8px 2px}
input[type=text],input[type=number],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus,textarea:focus{outline:2px solid var(--indigo2);outline-offset:1px}
label.f{display:block;font-size:13px;color:var(--sub);font-weight:700;margin:12px 2px 5px}
#preview{width:100%;border-radius:12px;margin-top:10px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--indigo2);color:var(--indigo2);background:var(--paper);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;font-size:15px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px;display:none}
.progress i{display:block;height:100%;width:0;background:var(--stitch);transition:width .2s}

/* 値札カード */
.tag{position:relative;background:var(--paper);border-radius:6px 18px 18px 6px;margin:22px 0 0 14px;padding:18px 18px 18px 34px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(31,58,95,.12)}
.tag::before{content:"";position:absolute;left:-14px;top:0;bottom:0;width:28px;background:var(--paper);clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%,0 50%)}
.tag::after{content:"";position:absolute;left:4px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line)}
.tag .stitch{position:absolute;inset:7px 7px 7px 22px;border:1.5px dashed var(--stitch);border-radius:3px 13px 13px 3px;pointer-events:none;opacity:.7}
.tag .kind{font-size:12px;color:var(--sub);font-weight:700}
.tag .code{font-size:26px;font-weight:900;letter-spacing:.03em;word-break:break-all;margin:2px 0 6px}
.grp{margin-top:16px}
.grp h3{font-size:14px;margin:0 0 8px;color:var(--indigo2)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:block;text-decoration:none;text-align:center;padding:12px 6px;border-radius:10px;background:var(--bg);color:var(--ink);font-weight:700;font-size:14px;border:1px solid var(--line)}
.links a small{display:block;font-weight:400;color:var(--sub);font-size:11px;margin-top:2px}

/* 履歴 */
.hist{list-style:none;margin:0;padding:0}
.hist li{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.hist .m{flex:1;min-width:0}
.hist .c{font-weight:900;font-size:17px;word-break:break-all}
.hist .s{font-size:12px;color:var(--sub);margin-top:2px}
.hist .p{font-weight:900;color:var(--indigo2);white-space:nowrap}
.hist button{border:0;background:none;color:var(--sub);font:inherit;padding:6px}
.empty{text-align:center;color:var(--sub);padding:40px 10px;line-height:1.8}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}

.ai{margin-top:12px;border-radius:12px;background:var(--bg);padding:12px 14px;border:1px solid var(--line)}
.ai .h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--sub)}
.ai .nm{font-size:17px;font-weight:900;margin:6px 0 2px;line-height:1.4}
.ai .pr{font-size:22px;font-weight:900;color:var(--indigo2);margin-top:6px}
.ai .nt{font-size:12px;color:var(--sub);line-height:1.6;margin-top:2px}
.ai .meta{font-size:13px;color:var(--sub);margin-top:2px}
.ai .src{margin-top:8px;font-size:12px}
.ai .src a{color:var(--indigo2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 0}
.conf{border-radius:999px;padding:2px 9px;font-size:11px;color:#fff}
.conf.high{background:#2E7D4F}.conf.medium{background:var(--stitch)}.conf.low{background:var(--danger)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--indigo2);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.qsel{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.qsel button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qsel button.on{border-color:var(--indigo2);color:var(--indigo2);font-weight:700}
.settings{margin-top:28px;padding-top:16px;border-top:1px dashed var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M8 3l-5 3 2 5 2-1v11h10V10l2 1 2-5-5-3c-.5 1.7-2 3-4 3S8.5 4.7 8 3z"/></svg>
    服サーチ
  </h1>
  <nav class="tabs">
    <button class="on" data-tab="scan">読み取り</button>
    <button data-tab="hist">履歴</button>
  </nav>
</header>

<main>
  <!-- 読み取り -->
  <section id="tab-scan" class="panel on">
    <div class="seg" id="modeSeg">
      <button class="on" data-mode="ocr">タグ撮影（AI）</button>
      <button data-mode="manual">手入力</button>
    </div>

    <div class="panel on" id="mode-ocr">
      <div id="camWrap"><video id="cam" playsinline muted autoplay></video><div class="frame"></div><div class="flash" id="flash"></div>
        <button class="shutter" id="btnShot" aria-label="撮影"></button></div>
      <div id="camCtrl" class="camctrl" style="display:none">
        <div class="zm"><span>ズーム</span><input type="range" id="zoom" min="1" max="4" step="0.1" value="1"><b id="zoomVal">1.0×</b></div>
        <div class="ln"><select id="lensSel" aria-label="使うカメラ"></select></div>
      </div>
      <div class="row"><button class="btn" id="btnCam">カメラを起動</button><button class="btn ghost" id="btnCamStop" style="display:none">カメラを閉じる</button></div>
      <div class="row"><label class="btn ghost" for="ocrFile">写真から選ぶ</label></div>
      <input type="file" id="ocrFile" accept="image/*" multiple hidden>
      <div id="trayWrap" style="display:none">
        <div class="trayh"><span>撮影した写真</span><span id="trayCount"></span></div>
        <div class="tray" id="tray"></div>
        <div class="row"><button class="btn" id="btnSend">この写真で検索</button></div>
      </div>
      <p class="hint"><b>撮り方のコツ</b><br>・スマホを15cmほど離してピントを合わせ、ズームで文字を大きくして撮る<br>・首元のブランドタグと、脇や裾の品質表示タグ（品番・RN/CA番号など）を合わせて最大3枚撮ると精度が上がります<br>・ぼやける場合は下のカメラ選択を切り替えてください（iPhone Proは「トリプル」「デュアル広角」が近距離に強い）</p>
    </div>

    <div class="panel" id="mode-manual">
      <label class="f" for="manualCode">JAN・品番</label>
      <input type="text" id="manualCode" placeholder="例: 4901234567894 / AB-1234" autocomplete="off">
      <div class="row"><button class="btn" id="btnManual">この内容で検索</button></div>
    </div>

    <div id="result"></div>
  </section>

  <!-- 履歴 -->
  <section id="tab-hist" class="panel">
    <input type="text" id="histFilter" placeholder="履歴を絞り込み（品番・ブランド・メモ）">
    <ul class="hist" id="histList" style="margin-top:12px"></ul>
    <div class="row"><button class="btn ghost" id="btnClear">履歴をすべて削除</button></div>
    <div class="settings">
      <label class="f" for="tokenIn">合言葉（GAS側でAPP_TOKENを設定した場合のみ）</label>
      <input type="text" id="tokenIn" placeholder="未設定なら空欄" autocomplete="off">
      <div class="row"><button class="btn ghost" id="btnToken">合言葉を保存</button><button class="btn ghost" id="btnPing">接続テスト</button></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
// ===== ここにGASのWebアプリURL（/exec で終わるもの）を貼る =====
const GAS_URL = 'https://script.google.com/macros/s/AKfycbx6Gs3a4Qr7mj9TXPbPC1OStnVv9177LoVLeIjxxLqUCLWYTZZmivsP9NrV8LoE2lBojQ/exec';
// ================================================================

const $ = s => document.querySelector(s);
const KEY = 'fukuSearch.history.v1';
const TOKEN_KEY = 'fukuSearch.token';
let current = null;   // {code, kind, ai, query}

/* ---------- 共通 ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){toast('保存できませんでした')}}
function loadHist(){try{return JSON.parse(lsGet(KEY,'[]'))||[]}catch(e){return []}}
function saveHist(h){lsSet(KEY,JSON.stringify(h))}
function isJan(s){return /^\d{8}$|^\d{12,13}$/.test(s)}
function yen(n){return '¥'+Number(n).toLocaleString()}

/* ---------- GAS呼び出し ---------- */
async function callAI(payload){
  if(!GAS_URL) throw new Error('GAS_URLが未設定です');
  let r;
  try{
    r = await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({...payload,token:lsGet(TOKEN_KEY,'')})});
  }catch(e){ throw new Error('GASに接続できません。通信状態と、GAS_URLが /exec で終わっているか確認してください'); }
  const txt = await r.text();
  let d;
  try{ d = JSON.parse(txt); }catch(e){
    throw new Error('GASがJSON以外を返しました。デプロイの「アクセスできるユーザー」を「全員」にして新バージョンでデプロイし直してください');
  }
  if(!d.ok) throw new Error((d.error||'AIの呼び出しに失敗しました')+(d.model?`（モデル: ${d.model}）`:''));
  return d;
}

/* ---------- タブ ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('#tab-scan').classList.toggle('on',b.dataset.tab==='scan');
  $('#tab-hist').classList.toggle('on',b.dataset.tab==='hist');
  if(b.dataset.tab==='hist'){stopCam();renderHist()}
});
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b));
  ['ocr','manual'].forEach(m=>$('#mode-'+m).classList.toggle('on',m===b.dataset.mode));
  if(b.dataset.mode!=='ocr') stopCam();
});

/* ---------- 無音カメラ（映像のフレームを切り出すのでシャッター音なし） ---------- */
const LENS_KEY='fukuSearch.lens';
let stream=null, zoom=1;
const shots=[];            // 撮影した画像（Blob）最大3枚
const MAX_SHOTS=3;

async function openCam(deviceId){
  stopCam(true);
  const video = deviceId
    ? {deviceId:{exact:deviceId},width:{ideal:3840},height:{ideal:2160}}
    : {facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}};
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video});
  const v=$('#cam'); v.srcObject=stream; await v.play();
  $('#camWrap').style.aspectRatio=`${v.videoWidth} / ${v.videoHeight}`;
  $('#camWrap').style.display='block'; $('#camCtrl').style.display='flex';
  $('#btnCam').style.display='none'; $('#btnCamStop').style.display='';
  const t=stream.getVideoTracks()[0];
  try{ // 対応端末（主にAndroid）では連続オートフォーカスを要求
    const cap=t.getCapabilities?t.getCapabilities():{};
    if(cap.focusMode&&cap.focusMode.includes('continuous')) await t.applyConstraints({advanced:[{focusMode:'continuous'}]});
  }catch(e){}
  setZoom(zoom);
}
async function listLenses(){
  const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  const back=devs.filter(d=>/背面|back|rear|environment/i.test(d.label));
  const list=back.length?back:devs;
  const sel=$('#lensSel');
  sel.innerHTML=list.map(d=>`<option value="${esc(d.deviceId)}">${esc(d.label||'カメラ')}</option>`).join('');
  sel.parentElement.style.display=list.length>1?'':'none';
  return list;
}
function pickDefaultLens(list){
  const saved=lsGet(LENS_KEY,'');
  if(saved&&list.some(d=>d.deviceId===saved)) return saved;
  // iPhone Proは「トリプル／デュアル広角」を選ぶと近距離で自動的にマクロ（超広角）へ切り替わる
  const pref=[/トリプル|triple/i,/デュアル広角|dual wide/i,/デュアル|dual/i];
  for(const re of pref){const d=list.find(x=>re.test(x.label)); if(d) return d.deviceId}
  return '';
}
$('#btnCam').onclick=async()=>{
  try{
    await openCam(null);
    const list=await listLenses();
    const id=pickDefaultLens(list);
    if(id){ $('#lensSel').value=id; await openCam(id); }
  }catch(e){toast('カメラを起動できません（HTTPSと権限を確認）')}
};
$('#lensSel').onchange=async e=>{
  lsSet(LENS_KEY,e.target.value);
  try{await openCam(e.target.value)}catch(err){toast('このカメラは使えません')}
};
$('#btnCamStop').onclick=()=>stopCam();
function stopCam(keepUI){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if(keepUI) return;
  $('#camWrap').style.display='none'; $('#camCtrl').style.display='none';
  $('#btnCam').style.display=''; $('#btnCamStop').style.display='none';
}
function setZoom(z){
  zoom=z; $('#cam').style.transform=`scale(${z})`;
  $('#zoomVal').textContent=z.toFixed(1)+'×'; $('#zoom').value=z;
}
$('#zoom').oninput=e=>setZoom(parseFloat(e.target.value));

// 現在のズーム範囲を切り出し
function grabFrame(){
  const v=$('#cam'); const W=v.videoWidth,H=v.videoHeight;
  const cw=Math.round(W/zoom), ch=Math.round(H/zoom), sx=Math.round((W-cw)/2), sy=Math.round((H-ch)/2);
  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  c.getContext('2d').drawImage(v,sx,sy,cw,ch,0,0,cw,ch);
  return c;
}
// ピントの合い具合（ラプラシアン分散）を簡易計算
function sharpness(c){
  const w=320,h=Math.round(c.height*320/c.width);
  const t=document.createElement('canvas'); t.width=w; t.height=h;
  const g=t.getContext('2d'); g.drawImage(c,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data, gray=new Float32Array(w*h);
  for(let i=0;i<w*h;i++) gray[i]=d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114;
  let sum=0,sq=0,n=0;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    const i=y*w+x, l=4*gray[i]-gray[i-1]-gray[i+1]-gray[i-w]-gray[i+w];
    sum+=l; sq+=l*l; n++;
  }
  const m=sum/n; return sq/n-m*m;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
$('#btnShot').onclick=async()=>{
  const v=$('#cam'); if(!v.videoWidth) return;
  if(shots.length>=MAX_SHOTS){toast(`撮影は${MAX_SHOTS}枚までです`);return}
  $('#btnShot').disabled=true;
  // 0.1秒おきに5コマ撮って一番シャープなものを採用（手ブレ・ピンボケ対策）
  let best=null,bestS=-1;
  for(let i=0;i<5;i++){
    const c=grabFrame(), s=sharpness(c);
    if(s>bestS){bestS=s;best=c}
    await wait(100);
  }
  const fl=$('#flash'); fl.style.opacity='.8'; setTimeout(()=>fl.style.opacity='0',120);
  if(navigator.vibrate) navigator.vibrate(30);
  best.toBlob(b=>{addShot(b);$('#btnShot').disabled=false},'image/jpeg',0.92);
};

/* ---------- 撮影トレイ ---------- */
function addShot(b){ if(shots.length<MAX_SHOTS){shots.push(b);renderTray()} }
function renderTray(){
  const t=$('#tray');
  t.innerHTML=shots.map((b,i)=>`<div class="th"><img src="${URL.createObjectURL(b)}" alt="撮影${i+1}"><button data-i="${i}" aria-label="削除">×</button></div>`).join('');
  t.querySelectorAll('button').forEach(x=>x.onclick=()=>{shots.splice(+x.dataset.i,1);renderTray()});
  $('#trayWrap').style.display=shots.length?'block':'none';
  $('#trayCount').textContent=`${shots.length} / ${MAX_SHOTS}枚`;
}
$('#btnSend').onclick=()=>{ if(shots.length){ stopCam(); analyzeImages(shots.slice()); } };
$('#ocrFile').onchange=e=>{
  [...e.target.files].slice(0,MAX_SHOTS-shots.length).forEach(addShot);
  e.target.value='';
};

/* ---------- コード → AI ---------- */
async function startCode(code,kind){
  setResult({code,kind,ai:null,loading:true});
  try{
    const d = await callAI({mode:'code',code});
    setResult({code,kind,ai:d.item,sources:d.sources});
  }catch(e){ setResult({code,kind,ai:null,error:e.message}); }
}

/* ---------- タグ撮影 → AI ---------- */
let lastImages=null;
function toJpegB64(blob,max=1600){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.85).split(',')[1]);
    };
    img.onerror=()=>rej(new Error('画像を読み込めませんでした'));
    img.src=URL.createObjectURL(blob);
  });
}
async function analyzeImages(list){
  lastImages=list;
  setResult({code:'',kind:'tag',ai:null,loading:true});
  try{
    const images=[];
    for(const b of list) images.push({data:await toJpegB64(b),mimeType:'image/jpeg'});
    const d=await callAI({mode:'image',images});
    setResult({code:d.item.code||'',kind:'tag',ai:d.item,sources:d.sources});
    shots.length=0; renderTray();
  }catch(err){ setResult({code:'',kind:'tag',ai:null,error:err.message,fromImage:true}); }
}

/* ---------- 手入力 ---------- */
$('#btnManual').onclick=()=>{const v=$('#manualCode').value.trim();if(v)startCode(v,isJan(v)?'barcode':'tag')};
$('#manualCode').onkeydown=e=>{if(e.key==='Enter')$('#btnManual').click()};

/* ---------- 検索リンク ---------- */
const E = encodeURIComponent;
const SITES = {
  used:[
    {n:'メルカリ',d:'売り切れ',u:q=>`https://jp.mercari.com/search?keyword=${E(q)}&status=sold_out`},
    {n:'ヤフオク',d:'落札相場',u:q=>`https://auctions.yahoo.co.jp/closedsearch/closedsearch?p=${E(q)}`},
    {n:'ラクマ',d:'売り切れ',u:q=>`https://fril.jp/s?query=${E(q)}&transaction=soldout`},
    {n:'セカスト',d:'オンライン在庫',u:q=>`https://www.2ndstreet.jp/search?keyword=${E(q)}`},
  ],
  info:[
    {n:'Google',d:'商品情報',u:q=>`https://www.google.com/search?q=${E(q)}`},
    {n:'Google画像',d:'見た目で確認',u:q=>`https://www.google.com/search?tbm=isch&q=${E(q)}`},
    {n:'楽天市場',d:'新品価格',u:q=>`https://search.rakuten.co.jp/search/mall/${E(q)}/`},
    {n:'Yahoo!ショッピング',d:'新品価格',u:q=>`https://shopping.yahoo.co.jp/search?p=${E(q)}`},
  ]
};
function linksHTML(list,q){return list.map(s=>`<a href="${s.u(q)}" target="_blank" rel="noopener">${s.n}<small>${s.d}</small></a>`).join('')}

function aiHTML(st){
  if(st.loading) return `<div class="ai"><span class="spin"></span>Geminiで商品を特定しています…</div>`;
  if(st.error) return `<div class="ai"><div class="h">AI判定</div><div class="nt" style="color:var(--danger)">${esc(st.error)}</div>
    ${st.code?`<div class="row"><button class="btn ghost" id="btnRetry">もう一度AIに聞く</button></div>`:''}
    ${st.fromImage&&lastImages?`<div class="row"><button class="btn ghost" id="btnRetryImg">同じ画像で再読み込み</button></div>`:''}</div>`;
  const a=st.ai; if(!a) return '';
  const conf={high:'確度 高',medium:'確度 中',low:'確度 低'}[a.confidence]||'';
  const meta=[a.category,a.material,a.size].filter(Boolean).join(' / ');
  return `<div class="ai">
    <div class="h"><span>AI判定</span>${conf?`<span class="conf ${esc(a.confidence)}">${conf}</span>`:''}</div>
    <div class="nm">${esc([a.brand,a.name].filter(Boolean).join(' '))||'不明'}</div>
    ${meta?`<div class="meta">${esc(meta)}</div>`:''}
    <div class="pr">${a.price_jpy?'定価 '+yen(a.price_jpy):'定価 不明'}</div>
    ${a.price_note?`<div class="nt">${esc(a.price_note)}</div>`:''}
    ${(st.sources||[]).length?`<div class="src">${st.sources.map(s=>`<a href="${esc(s.uri)}" target="_blank" rel="noopener">${esc(s.title||s.uri)}</a>`).join('')}</div>`:''}
  </div>`;
}

function setResult(st){
  current=st;
  const a=st.ai||{};
  const cands=[...new Set([a.query,[a.brand,a.name].filter(Boolean).join(' '),[a.brand,a.code||st.code].filter(Boolean).join(' '),st.code].map(x=>(x||'').trim()).filter(Boolean))];
  st.query = st.query || cands[0] || '';
  $('#result').innerHTML=`
  <div class="tag"><span class="stitch"></span>
    <div class="kind">${st.kind==='barcode'?'JAN（手入力）':'タグ'}</div>
    <div class="code">${esc(st.code||a.code||'—')}</div>
    ${aiHTML(st)}
    ${cands.length?`<label class="f">検索語</label>
    <div class="qsel" id="qsel">${cands.map(c=>`<button class="${c===st.query?'on':''}">${esc(c)}</button>`).join('')}</div>
    <input type="text" id="rQuery" value="${esc(st.query)}" style="margin-top:8px" autocomplete="off">
    <div id="rLinks"></div>
    <label class="f" for="rPrice">店頭価格（円）</label>
    <input type="number" id="rPrice" inputmode="numeric" placeholder="例: 1980">
    <label class="f" for="rMemo">メモ</label>
    <input type="text" id="rMemo" placeholder="店舗・サイズ・状態など">
    <div class="row"><button class="btn" id="btnSave">履歴に保存</button></div>`:''}
  </div>`;
  if($('#btnRetry')) $('#btnRetry').onclick=()=>startCode(st.code,st.kind);
  if($('#btnRetryImg')) $('#btnRetryImg').onclick=()=>analyzeImages(lastImages);
  if(!cands.length) return;
  const upd=()=>{
    const q=$('#rQuery').value.trim(); st.query=q;
    $('#rLinks').innerHTML=q?`<div class="grp"><h3>中古相場</h3><div class="links">${linksHTML(SITES.used,q)}</div></div>
      <div class="grp"><h3>定価・商品情報</h3><div class="links">${linksHTML(SITES.info,q)}</div></div>`:'';
    document.querySelectorAll('#qsel button').forEach(b=>b.classList.toggle('on',b.textContent===q));
  };
  document.querySelectorAll('#qsel button').forEach(b=>b.onclick=()=>{$('#rQuery').value=b.textContent;upd()});
  $('#rQuery').oninput=upd; upd();
  $('#btnSave').onclick=()=>{
    const h=loadHist();
    h.unshift({id:Date.now(),code:st.code||a.code||'',kind:st.kind,brand:a.brand||'',name:a.name||'',
      list:a.price_jpy||null,query:st.query,price:$('#rPrice').value,memo:$('#rMemo').value.trim(),
      ai:st.ai,sources:st.sources||[],at:new Date().toISOString()});
    saveHist(h.slice(0,500)); toast('履歴に保存しました');
  };
  if(!st.loading) $('#result').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- 履歴 ---------- */
function renderHist(){
  const f=$('#histFilter').value.trim().toLowerCase();
  const all=loadHist();
  const h=all.filter(x=>!f||[x.code,x.brand,x.name,x.memo,x.query].join(' ').toLowerCase().includes(f));
  const ul=$('#histList');
  if(!h.length){ul.innerHTML=`<li class="empty" style="display:block;border:0;background:none">${f?'該当する履歴はありません':'保存した服がここに並びます。<br>読み取り後に「履歴に保存」を押してください。'}</li>`;return}
  ul.innerHTML=h.map(x=>{
    const d=new Date(x.at);
    const title=[x.brand,x.name].filter(Boolean).join(' ')||x.code;
    const sub=[`${d.getMonth()+1}/${d.getDate()}`,x.code&&x.code!==title?x.code:'',x.list?'定価'+yen(x.list):'',x.memo].filter(Boolean).join('　');
    return `<li data-id="${x.id}">
      <div class="m"><div class="c">${esc(title)}</div><div class="s">${esc(sub)}</div></div>
      ${x.price?`<div class="p">${yen(x.price)}</div>`:''}
      <button class="del" aria-label="削除"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </li>`}).join('');
  ul.querySelectorAll('li[data-id]').forEach(li=>{
    const x=all.find(y=>String(y.id)===li.dataset.id);
    li.querySelector('.m').onclick=()=>{document.querySelector('.tabs button[data-tab=scan]').click();
      setResult({code:x.code,kind:x.kind,ai:x.ai||null,sources:x.sources||[],query:x.query})};
    li.querySelector('.del').onclick=()=>{saveHist(loadHist().filter(y=>String(y.id)!==li.dataset.id));renderHist()};
  });
}
$('#histFilter').oninput=renderHist;
$('#btnClear').onclick=()=>{if(confirm('履歴をすべて削除しますか？')){saveHist([]);renderHist()}};

/* ---------- 設定 ---------- */
$('#tokenIn').value=lsGet(TOKEN_KEY,'');
$('#btnToken').onclick=()=>{lsSet(TOKEN_KEY,$('#tokenIn').value.trim());toast('合言葉を保存しました')};
$('#btnPing').onclick=async()=>{
  if(!GAS_URL){toast('GAS_URLが未設定です');return}
  try{toast('テスト中…');const r=await fetch(GAS_URL+'?test=1');const d=await r.json();alert(d.ok?`接続OK\nモデル: ${d.model}\nGemini応答: ${d.reply||'—'}`:`エラー: ${d.error}`)}
  catch(e){toast('接続に失敗しました')}
};

</script>
